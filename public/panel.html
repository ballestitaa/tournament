<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Capitán | Team Schedule</title>
  <script>
    (function() {
      var isTournament = window.location.pathname.startsWith('/tournament');
      var baseHref = isTournament ? '/tournament/' : '/';
      document.write('<base href="' + baseHref + '">');
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2'><rect x='3' y='4' width='18' height='18' rx='2'/><line x1='16' y1='2' x2='16' y2='6'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='3' y1='10' x2='21' y2='10'/></svg>">
</head>
<body>
  <div class="container-wide">
    <!-- Loading -->
    <div id="loading-view">
      <div class="header">
        <div class="logo">Team Schedule <span class="watermark-inline">by ballestitaa</span></div>
      </div>
      <div class="spinner"></div>
    </div>

    <!-- Error -->
    <div id="error-view" class="hidden">
      <div class="header">
        <div class="logo">Team Schedule <span class="watermark-inline">by ballestitaa</span></div>
        <h1>Acceso denegado</h1>
        <p class="subtitle">La clave de administrador no es válida o la sala no existe.</p>
      </div>
      <div class="text-center">
        <button class="btn btn-secondary" id="back-home-btn">Volver al inicio</button>
      </div>
    </div>

    <!-- Panel -->
    <div id="panel-view" class="hidden">
      <!-- Top Bar -->
      <div class="panel-top-bar">
        <div>
          <div class="logo" style="font-size:0.7rem; font-weight:600; letter-spacing:0.15em; text-transform:uppercase; color:var(--text-muted); margin-bottom:0.5rem">Panel de Capitán <span class="watermark-inline">by ballestitaa</span></div>
          <h1 id="panel-room-name"></h1>
        </div>
        <div style="display:flex; align-items:center; gap:1rem">
          <div class="link-box" style="margin:0">
            <span id="share-link-text" style="max-width:180px"></span>
            <button class="btn-icon" id="copy-share-link" title="Copiar enlace de jugadores"></button>
          </div>
          <button class="btn btn-secondary" id="refresh-btn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
            Actualizar
          </button>
        </div>
      </div>

      <!-- Stats -->
      <div class="panel-stats mb-2">
        <div class="stat">
          <div class="stat-value" id="stat-players">0</div>
          <div class="stat-label">Jugadores</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="stat-best">—</div>
          <div class="stat-label">Mejor franja</div>
        </div>
      </div>

      <!-- Main: Heatmap + Players -->
      <div class="panel-main">
        <!-- Heatmap -->
        <div class="card">
          <div class="card-header">
            <h3>Mapa de disponibilidad</h3>
            <span class="text-secondary" style="font-size:0.8rem" id="filter-label"></span>
          </div>
          <div class="grid-wrapper">
            <div class="schedule-grid" id="heatmap-grid"></div>
          </div>
          <div class="heatmap-legend" id="heatmap-legend"></div>

          <!-- Best times -->
          <div class="best-times" id="best-times"></div>
        </div>

        <!-- Player List -->
        <div>
          <div class="card">
            <div class="card-header">
              <h3>Jugadores</h3>
              <span class="text-secondary" style="font-size:0.8rem" id="player-count-label"></span>
            </div>
            <div class="player-list" id="player-list"></div>
          </div>
        </div>
      </div>

      <footer class="watermark">ballestitaa</footer>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
      <div class="tooltip-title" id="tooltip-title"></div>
      <div class="tooltip-names" id="tooltip-names"></div>
    </div>
  </div>

  <script>
    // --- Monochrome Icons ---
    const ICONS = {
      copy: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>',
      check: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
      users: '<svg class="icon icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>'
    };

    // --- Config ---
    const DAYS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
    const HOUR_START = 10;
    const HOUR_END = 24;

    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);

    $('#back-home-btn').onclick = () => {
      window.location.href = document.baseURI;
    };

    // --- State ---
    let roomCode = '';
    let adminKey = '';
    let jugadores = [];
    let activePlayer = null;
    let heatmapData = {};

    // --- Init ---
    (async function init() {
      const params = new URLSearchParams(window.location.search);
      roomCode = (params.get('sala') || '').toUpperCase();
      adminKey = params.get('clave') || '';

      if (!roomCode || !adminKey) {
        showView('error');
        return;
      }

      await loadData();
    })();

    async function loadData() {
      try {
        const res = await fetch(`api/salas/${roomCode}/panel?clave=${adminKey}`);
        if (!res.ok) throw new Error();
        const data = await res.json();

        jugadores = data.jugadores;
        $('#panel-room-name').textContent = data.nombre;

        const shareLink = new URL(`jugador.html?sala=${roomCode}`, document.baseURI).href;
        $('#share-link-text').textContent = shareLink;
        setupCopy('#copy-share-link', shareLink);

        buildHeatmapData();
        renderHeatmap();
        renderPlayerList();
        updateStats();

        showView('panel');
      } catch {
        showView('error');
      }
    }

    function showView(name) {
      ['loading', 'error', 'panel'].forEach(v => {
        $(`#${v}-view`).classList.toggle('hidden', v !== name);
      });
    }

    // --- Heatmap Data ---
    function buildHeatmapData() {
      heatmapData = {};
      const source = activePlayer
        ? jugadores.filter(j => j.nombre === activePlayer)
        : jugadores;

      source.forEach(j => {
        j.slots.forEach(key => {
          if (!heatmapData[key]) heatmapData[key] = { count: 0, names: [] };
          heatmapData[key].count++;
          heatmapData[key].names.push(j.nombre);
        });
      });
    }

    // --- Render Heatmap ---
    function renderHeatmap() {
      const grid = $('#heatmap-grid');
      grid.innerHTML = '';
      grid.style.gridTemplateColumns = `52px repeat(${DAYS.length}, 1fr)`;

      const maxCount = activePlayer ? 1 : jugadores.length;

      // Corner
      grid.appendChild(Object.assign(document.createElement('div'), { className: 'grid-corner' }));

      // Day headers
      DAYS.forEach(day => {
        const hdr = document.createElement('div');
        hdr.className = 'grid-day-header';
        hdr.textContent = day;
        grid.appendChild(hdr);
      });

      // Rows
      for (let h = HOUR_START; h < HOUR_END; h++) {
        const label = document.createElement('div');
        label.className = 'grid-time-label';
        label.textContent = `${h.toString().padStart(2, '0')}:00`;
        grid.appendChild(label);

        DAYS.forEach((day, di) => {
          const key = `${di}-${h}`;
          const cell = document.createElement('div');
          cell.className = 'heatmap-cell';

          const info = heatmapData[key];
          const count = info ? info.count : 0;

          if (maxCount > 0 && count > 0) {
            const intensity = count / maxCount;
            const brightness = Math.round(30 + intensity * 225);
            cell.style.background = `rgb(${brightness}, ${brightness}, ${brightness})`;
            cell.style.color = brightness > 140 ? '#0a0a0a' : '#ffffff';

            const countSpan = document.createElement('span');
            countSpan.className = 'cell-count';
            countSpan.textContent = count;
            cell.appendChild(countSpan);
          } else {
            cell.style.background = 'var(--cell-off)';
          }

          cell.addEventListener('mouseenter', (e) => showTooltip(e, day, h, info));
          cell.addEventListener('mouseleave', hideTooltip);
          cell.addEventListener('mousemove', moveTooltip);

          grid.appendChild(cell);
        });
      }

      renderLegend(maxCount);
      $('#filter-label').textContent = activePlayer ? `Filtro: ${activePlayer}` : 'Todos los jugadores';
    }

    function renderLegend(max) {
      const legend = $('#heatmap-legend');
      if (max === 0) { legend.innerHTML = ''; return; }

      let html = '<span>0</span><div class="legend-bar">';
      const steps = Math.min(max, 6);
      for (let i = 0; i <= steps; i++) {
        const intensity = i / steps;
        const b = Math.round(30 + intensity * 225);
        html += `<div class="legend-swatch" style="background:rgb(${b},${b},${b})"></div>`;
      }
      html += `</div><span>${max}</span>`;
      legend.innerHTML = html;
    }

    // --- Best Times ---
    function updateStats() {
      $('#stat-players').textContent = jugadores.length;
      $('#player-count-label').textContent = `${jugadores.length} registrados`;

      const entries = Object.entries(heatmapData)
        .map(([key, val]) => ({ key, ...val }))
        .sort((a, b) => b.count - a.count);

      const total = activePlayer ? 1 : jugadores.length;
      const best = entries.length > 0 ? entries[0] : null;

      if (best && total > 0) {
        const [di, h] = best.key.split('-').map(Number);
        $('#stat-best').textContent = `${DAYS[di]} ${h.toString().padStart(2, '0')}:00`;
      } else {
        $('#stat-best').textContent = '—';
      }

      const bestTimesEl = $('#best-times');
      if (entries.length === 0 || total === 0) {
        bestTimesEl.innerHTML = '';
        return;
      }

      const top5 = entries.slice(0, 5);
      let html = '<p class="label">Mejores franjas</p>';
      top5.forEach(item => {
        const [di, h] = item.key.split('-').map(Number);
        const pct = Math.round((item.count / total) * 100);
        html += `
          <div class="best-time-item">
            <span style="min-width:80px; font-weight:500">${DAYS[di]} ${h.toString().padStart(2, '0')}:00</span>
            <div style="flex:1; background:var(--border); border-radius:3px; height:6px; overflow:hidden">
              <div class="best-time-bar" style="width:${pct}%"></div>
            </div>
            <span style="min-width:56px; text-align:right; color:var(--text-secondary); font-size:0.8rem">
              ${item.count}/${total}
            </span>
          </div>`;
      });
      bestTimesEl.innerHTML = html;
    }

    // --- Tooltip ---
    function showTooltip(e, day, hour, info) {
      const tip = $('#tooltip');
      $('#tooltip-title').textContent = `${day} ${hour.toString().padStart(2, '0')}:00`;
      if (info && info.names.length > 0) {
        $('#tooltip-names').textContent = info.names.join(', ');
      } else {
        $('#tooltip-names').textContent = 'Nadie disponible';
      }
      tip.classList.add('visible');
      moveTooltip(e);
    }

    function moveTooltip(e) {
      const tip = $('#tooltip');
      tip.style.left = (e.clientX + 12) + 'px';
      tip.style.top = (e.clientY + 12) + 'px';
    }

    function hideTooltip() {
      $('#tooltip').classList.remove('visible');
    }

    // --- Player List ---
    function renderPlayerList() {
      const list = $('#player-list');

      if (jugadores.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="icon">${ICONS.users}</div>
            <p>Aún no hay jugadores</p>
          </div>`;
        return;
      }

      list.innerHTML = '';
      jugadores.forEach(j => {
        const item = document.createElement('div');
        item.className = 'player-item' + (activePlayer === j.nombre ? ' active' : '');

        const initials = j.nombre.slice(0, 2).toUpperCase();

        item.innerHTML = `
          <div class="player-avatar">${initials}</div>
          <div style="flex:1">
            <div class="player-name">${escapeHtml(j.nombre)}</div>
            <div class="player-meta">${j.slots.length} horas</div>
          </div>
          <button class="btn-danger delete-player-btn" title="Eliminar jugador">✕</button>
        `;

        item.addEventListener('click', (e) => {
          if (e.target.closest('.delete-player-btn')) return;
          activePlayer = activePlayer === j.nombre ? null : j.nombre;
          buildHeatmapData();
          renderHeatmap();
          renderPlayerList();
          updateStats();
        });

        item.querySelector('.delete-player-btn').addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm(`¿Eliminar a ${j.nombre}?`)) return;

          try {
            const res = await fetch(`api/salas/${roomCode}/jugadores/${encodeURIComponent(j.nombre)}?clave=${adminKey}`, {
              method: 'DELETE'
            });
            if (!res.ok) throw new Error();

            jugadores = jugadores.filter(p => p.nombre !== j.nombre);
            if (activePlayer === j.nombre) activePlayer = null;
            buildHeatmapData();
            renderHeatmap();
            renderPlayerList();
            updateStats();
          } catch {
            alert('Error al eliminar jugador');
          }
        });

        list.appendChild(item);
      });
    }

    // --- Refresh ---
    $('#refresh-btn').addEventListener('click', async () => {
      const btn = $('#refresh-btn');
      btn.disabled = true;
      await loadData();
      btn.disabled = false;
    });

    // --- Copy ---
    function setupCopy(btnSel, text) {
      const btn = $(btnSel);
      btn.innerHTML = ICONS.copy;
      btn.onclick = async () => {
        try {
          await navigator.clipboard.writeText(text);
          btn.innerHTML = ICONS.check;
          setTimeout(() => { btn.innerHTML = ICONS.copy; }, 1500);
        } catch {
          prompt('Copia este enlace:', text);
        }
      };
    }

    // --- Utils ---
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
